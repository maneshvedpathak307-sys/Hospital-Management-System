# ==========================================
# HOSPITAL MANAGEMENT SYSTEM
# ==========================================

# Application Name
spring.application.name=hospital-management-system


# ==========================================
# SERVER CONFIGURATION
# ==========================================

server.port=8080


# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3307/hospital_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true

spring.datasource.username=root

spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================

# Automatically create/update tables from Java entities
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console
spring.jpa.show-sql=false

# Format SQL queries
spring.jpa.properties.hibernate.format_sql=true

# Disable Open Session in View warning
spring.jpa.open-in-view=false


# ==========================================
# JSON CONFIGURATION
# ==========================================

spring.jackson.serialization.fail-on-empty-beans=false